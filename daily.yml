name: 构建并发布 AI 日报

on:
  schedule:
    # 每天北京时间 08:10 生成(UTC 00:10),避开整点高峰
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYY-MM-DD,留空则取最新一期'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个,排队等待,避免并发推送
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成日报页面
        env:
          DATE_INPUT: ${{ inputs.date }}
        run: |
          if [ -n "$DATE_INPUT" ]; then
            python build.py --date "$DATE_INPUT"
          else
            python build.py
          fi

      - name: 归档可用产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
